services:
  postgres:
    image: postgres:17
    container_name: wallet_postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplica as migrations "up" e termina. O app só sobe depois que ele conclui.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./db/migrations:/migrations
    command: ["-path=/migrations", "-database", "postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    container_name: wallet_service
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
