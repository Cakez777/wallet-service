services:
  postgres:
    image: postgres:17
    container_name: wallet_postgres
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Aplica as migrations "up" e termina. O app só sobe depois que ele conclui.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./db/migrations:/migrations
    command: ["-path=/migrations", "-database", "postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  # IdP OAuth 2.0 / OIDC. O realm "wallet" (clientes e papéis de teste) é importado na subida.
  # O issuer fixo é http://localhost:8081/realms/wallet, igual para quem consulta de fora ou de dentro da rede.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wallet_keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/realm-wallet.json:/opt/keycloak/data/import/realm-wallet.json:ro

  app:
    build: .
    container_name: wallet_service
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet?sslmode=disable
      OIDC_ISSUER: http://localhost:8081/realms/wallet
      OIDC_JWKS_URL: http://keycloak:8080/realms/wallet/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

volumes:
  postgres_data:
